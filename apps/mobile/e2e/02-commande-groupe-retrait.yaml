appId: com.streetwear.app
name: Commande de groupe (12 t-shirts, 3 tailles) avec retrait en boutique, paiement Flooz
tags:
  - critique
# Client de démonstration +228 90 00 00 02.
# « Commande de groupe » (décision du chef de projet, 22/11/2026) : une personne commande pour un groupe
# le même design en plusieurs tailles, en un seul panier et un seul paiement : 5 M + 4 L + 3 XL.
# L'écran Taille garde la taille et la quantité quand on revient du panier.
---
- launchApp:
    clearState: true
- tapOn:
    text: 'Autoriser'
    optional: true
- runFlow:
    file: subflows/compose-design-and-pick-size.yaml
    env:
      SIZE: 'M'
- repeat:
    times: 4
    commands:
      - tapOn:
          id: 'quantity-inc'
- assertVisible:
    id: 'quantity-value'
    text: '5'
- tapOn:
    id: 'size-add-to-cart'
- extendedWaitUntil:
    visible:
      id: 'cart-line-M'
    timeout: 20000
# Deuxième taille : retour à l'écran Taille (quantité encore à 5), L × 4.
- back
- tapOn:
    id: 'size-L'
- tapOn:
    id: 'quantity-dec'
- assertVisible:
    id: 'quantity-value'
    text: '4'
- tapOn:
    id: 'size-add-to-cart'
- extendedWaitUntil:
    visible:
      id: 'cart-line-L'
    timeout: 20000
# Troisième taille : XL × 3.
- back
- tapOn:
    id: 'size-XL'
- tapOn:
    id: 'quantity-dec'
- assertVisible:
    id: 'quantity-value'
    text: '3'
- tapOn:
    id: 'size-add-to-cart'
- extendedWaitUntil:
    visible:
      id: 'cart-line-XL'
    timeout: 20000
- assertVisible:
    id: 'cart-line-M'
- assertVisible:
    id: 'cart-line-L'
- tapOn:
    id: 'cart-continue'
- runFlow:
    file: subflows/login.yaml
    env:
      PHONE_LOCAL: '90000002'
- extendedWaitUntil:
    visible:
      id: 'reception-mode-pickup'
    timeout: 30000
- tapOn:
    id: 'reception-mode-pickup'
# Demain : les créneaux du jour peuvent être passés.
- tapOn:
    id: 'pickup-day-1'
- extendedWaitUntil:
    visible:
      id: 'pickup-slot-0'
    timeout: 20000
- tapOn:
    id: 'pickup-slot-0'
- tapOn:
    id: 'reception-continue'
- extendedWaitUntil:
    visible:
      id: 'payment-method-flooz'
    timeout: 30000
- tapOn:
    id: 'payment-method-flooz'
- tapOn:
    id: 'payment-phone'
- inputText: '90000005'
- hideKeyboard
- tapOn:
    id: 'payment-pay'
- extendedWaitUntil:
    visible: 'Merci !.*'
    timeout: 90000
- assertVisible:
    id: 'order-number'
