appId: com.streetwear.app
name: Commande de groupe (5 t-shirts) avec retrait en boutique, paiement Flooz
tags:
  - critique
# Client de démonstration +228 90 00 00 02. « Groupe » = quantité 5 sur une ligne (maximum d'une ligne : voir CART_LINE_MAX_QUANTITY).
---
- launchApp:
    clearState: true
- tapOn:
    text: 'Autoriser'
    optional: true
- runFlow:
    file: subflows/compose-design-and-pick-size.yaml
    env:
      SIZE: 'M'
- repeat:
    times: 4
    commands:
      - tapOn:
          id: 'quantity-inc'
- assertVisible:
    id: 'quantity-value'
    text: '5'
- tapOn:
    id: 'size-add-to-cart'
- extendedWaitUntil:
    visible:
      id: 'cart-continue'
    timeout: 20000
- tapOn:
    id: 'cart-continue'
- runFlow:
    file: subflows/login.yaml
    env:
      PHONE_LOCAL: '90000002'
- extendedWaitUntil:
    visible:
      id: 'reception-mode-pickup'
    timeout: 30000
- tapOn:
    id: 'reception-mode-pickup'
# Demain : les créneaux du jour peuvent être passés.
- tapOn:
    id: 'pickup-day-1'
- extendedWaitUntil:
    visible:
      id: 'pickup-slot-0'
    timeout: 20000
- tapOn:
    id: 'pickup-slot-0'
- tapOn:
    id: 'reception-continue'
- extendedWaitUntil:
    visible:
      id: 'payment-method-flooz'
    timeout: 30000
- tapOn:
    id: 'payment-method-flooz'
- tapOn:
    id: 'payment-phone'
- inputText: '90000005'
- hideKeyboard
- tapOn:
    id: 'payment-pay'
- extendedWaitUntil:
    visible: 'Merci !.*'
    timeout: 90000
- assertVisible:
    id: 'order-number'
