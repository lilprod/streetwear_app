name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: streetwear
          POSTGRES_PASSWORD: streetwear
          POSTGRES_DB: streetwear_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U streetwear" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://streetwear:streetwear@localhost:5432/streetwear_test
      REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: ci-only-secret-ci-only-secret-0000
      TURBO_CACHE_DIR: .turbo-cache
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4.1.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@v4.2.3
        with:
          path: .turbo-cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma migrate deploy
      - name: Lint, typecheck, test, build (affected packages only)
        run: pnpm exec turbo run lint typecheck test build --affected
